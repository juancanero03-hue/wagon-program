filename = "tests/_shared/fixtures/pyth-sol.json"

# Ceremonia #40 (2026-07-29) — RECEPTOR DOBLE de Pyth. Las tres cuentas llevan
# EXACTAMENTE los mismos 133 bytes (feed id sha256("wagon-test-feed:C40"),
# precio 1500, expo 0, publish_time 2050 = fresca para siempre). Lo ÚNICO que
# cambia entre ellas es el `owner`, que es justo lo que valida read_pyth_price:
#   v1    -> receptor del SDK (rec5EK...), la generación VIEJA que hoy usa mainnet
#   v2    -> receptor NUEVO (rec2HH...), al que Pyth movió sus cuentas de precio
#   alien -> un tercer programa cualquiera: DEBE rechazarse (InvalidPriceAccount)
# Sin la fixture v2 la CI saldría verde sin haber ejercitado nunca el receptor
# nuevo, que es el motivo entero de esta ceremonia.

[[test.validator.account]]
address = "CTWSJYy5UJioUQ2zztx9z8cE7QhJAUxoKLqqEfwqF3RT"  # pyth C40 · receptor VIEJO (SDK)
filename = "tests/_shared/fixtures/pyth-c40-v1.json"

[[test.validator.account]]
address = "FDvuYSSsPwP7sEhHCMEfLodaHxSQ6iUrbgnbLhrJgSNE"  # pyth C40 · receptor NUEVO
filename = "tests/_shared/fixtures/pyth-c40-v2.json"

[[test.validator.account]]
address = "AsfWndgJ9PA3pwoGyhWLK528WBnta3roevouSdXFLSPp"  # pyth C40 · programa AJENO (debe fallar)
filename = "tests/_shared/fixtures/pyth-c40-alien.json"


