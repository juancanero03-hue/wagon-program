[package]
name = "mock-jupiter"
version = "0.1.0"
description = "Deterministic test-only Jupiter-shaped swap router. Never deployed to mainnet."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_jupiter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
solana-program = "1.18.22"
